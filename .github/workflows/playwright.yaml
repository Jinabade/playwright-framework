
name: Playwright Tests

on:
  push:
    branches: [master]

  pull_request:
    branches: [master]

  workflow_dispatch:
    inputs:
      test_suite:
        description: Select test suite
        type: choice
        options:
          - test:api
          - test:web
          - test:sanity
          - test:regression
          - test:e2e
          - test:master
          - test:datadriven
        default: test:api

      browser:
        description: Select browser
        type: choice
        options:
          - chromium
        default: chromium

jobs:
  test:
    timeout-minutes: 60
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run Playwright Tests
        shell: pwsh
        run: |
          $suite = "${{ inputs.test_suite || 'test:api' }}"
          $tag = $suite -replace 'test:', ''
          npx playwright test --grep "@$tag" --project=chromium
        env:
          CI: "1"

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30
          if-no-files-found: ignore
